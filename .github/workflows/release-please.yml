name: release-please

on:
  workflow_run:
    workflows: [tests]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the current main commit passed tests
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          main_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          conclusion=$(gh api "repos/$GH_REPO/actions/workflows/tests.yml/runs?branch=main&event=push&head_sha=$main_sha&per_page=1" --jq '.workflow_runs[0].conclusion // "pending"')
          if [ "$conclusion" = "success" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "The current main commit has not passed tests; waiting for a successful run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release PRs and GitHub releases
        if: steps.checks.outputs.ready == 'true'
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
